# Juegos Evita — cabeceras de seguridad de la SPA (VULN-09)
#
# Se incluye en el `server` y en cada `location` que define sus propios
# `add_header`: nginx NO hereda los `add_header` del bloque de arriba en una
# location que agrega alguno, y sin el include esas respuestas salían sin
# cabeceras.
#
# CSP: scripts sólo propios (el build de Vite no genera scripts inline); estilos
# propios + inline (los gráficos y Radix los usan); fuentes
# propias (las fuentes se sirven desde el sitio, VULN-41); imágenes
# propias, data/blob y https (fotos de noticias del portal oficial); la API va
# por el mismo origen (`/api`). Si algún despliegue apunta VITE_API_BASE_URL a
# otro origen, hay que sumarlo a `connect-src`.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Clickjacking: el panel administrativo no se puede embeber (navegadores viejos
# que no entienden `frame-ancestors`).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS sólo tiene efecto cuando el sitio se sirve por HTTPS (los navegadores lo
# ignoran por HTTP); queda listo para cuando haya TLS delante.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
