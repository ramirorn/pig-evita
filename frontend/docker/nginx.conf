# Juegos Evita — nginx del frontend (uso local con Docker)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # La API va al contenedor del backend. 10 MB: el límite de subida es 5 MB
    # y el backend es quien responde el 422 con su mensaje.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
        # 300 s: el sync manual de noticias tarda ~2 min (60 IDs con pausa de 1 s).
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
    }

    # Archivos con hash en el nombre: cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: toda ruta desconocida la resuelve React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
