# Borde SOLO de pruebas (no existe en producción).
# Cada prueba manda `x-test-ip` y el borde lo usa como IP de cliente hacia la API,
# así los límites por IP (login 5/15 min, lecturas públicas 20/min) se pueden medir
# o esquivar de forma determinista sin tocar la aplicación.
# `/` va al nginx real del frontend; `/api/` va derecho al backend.
map $http_x_test_ip $cliente {
    default $http_x_test_ip;
    ""      $remote_addr;
}
server {
    listen 80;
    client_max_body_size 20m;
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $cliente;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
