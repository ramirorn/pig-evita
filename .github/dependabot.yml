# VULN-15: actualizaciones de dependencias y de acciones de CI.
# Dependabot abre PRs semanales; las de seguridad llegan apenas se publican.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # VULN-16: imágenes base de los Dockerfile y de los compose.
  - package-ecosystem: docker
    directories:
      - /backend/docker
      - /frontend/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker-compose
    directories:
      - /
      - /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
