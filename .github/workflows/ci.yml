name: Juegos Evita Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# VULN-15: el token del workflow sólo lee el repositorio.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: evitas
          POSTGRES_PASSWORD: evitas_password
          POSTGRES_DB: evitas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        # Misma versión que las imágenes (node:22-alpine).
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    # VULN-15: análisis de componentes (SCA) en cada push. Sólo necesita el
    # lockfile. Bloquea con avisos críticos en dependencias de producción; los
    # altos se informan sin cortar el build (hay avisos sin versión corregida
    # que se siguen en documentacion/seguridad/relevamiento-owasp-2025.md).
    - name: Audit backend dependencies (critical blocks)
      working-directory: ./backend
      run: npm audit --package-lock-only --omit=dev --audit-level=critical

    - name: Audit frontend dependencies (critical blocks)
      working-directory: ./frontend
      run: npm audit --package-lock-only --omit=dev --audit-level=critical

    - name: Report high-severity advisories
      continue-on-error: true
      run: |
        (cd backend && npm audit --package-lock-only --omit=dev --audit-level=high)
        (cd frontend && npm audit --package-lock-only --omit=dev --audit-level=high)

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Generate Prisma Client
      working-directory: ./backend
      run: npx prisma generate
      
    - name: Run ESLint
      working-directory: ./backend
      run: npm run lint
      
    - name: Run Build
      working-directory: ./backend
      run: npm run build
      
    - name: Run Unit Tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://evitas:evitas_password@localhost:5432/evitas_db?schema=public
      run: npm run test
