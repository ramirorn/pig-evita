# ===========================================
# Juegos Evita - Development Docker Compose
# ===========================================
services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: evita-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: evita_user
      POSTGRES_PASSWORD: evita_password
      POSTGRES_DB: juegos_evita
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evita_user -d juegos_evita"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: evita-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: evita-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Se toman de backend/.env — no hay defaults: el backend rechaza "minioadmin".
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?definir MINIO_ACCESS_KEY en backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?definir MINIO_SECRET_KEY en backend/.env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
