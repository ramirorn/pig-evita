# ================================
# Juegos Evita - Nginx Configuration
# ================================

events {
    worker_connections 1024;
}

http {
    # VULN-35: el envío de la encuesta no queda en el access log (IP, User-Agent
    # y hora exacta de cada respuesta "anónima" de un menor).
    map $request_uri $loguear_acceso {
        ~^/api/v1/survey/responses  0;
        default                     1;
    }
    access_log /var/log/nginx/access.log combined if=$loguear_acceso;

    # Security headers. VULN-03: X-Frame-Options en DENY, igual que helmet en la
    # API (antes SAMEORIGIN contradecía la cabecera del backend).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream backend
    upstream backend {
        server app:3000;
    }

    # VULN-03: TLS. Este nginx sólo escucha en el 80. Si delante no hay un
    # balanceador o proxy que termine TLS, hay que habilitar el bloque de abajo
    # con los certificados del dominio (por ejemplo, Let's Encrypt montado en
    # /etc/nginx/certs) y descomentar la redirección del server del puerto 80.
    # Sin TLS, las credenciales y los datos personales de menores viajan en claro.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_session_cache shared:SSL:10m;
    #     # ...mismas locations que el server del puerto 80...
    # }

    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS in production (uncomment when SSL is configured)
        # return 301 https://$host$request_uri;

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Max body size for file uploads
            client_max_body_size 10M;
        }

        # Fotos de sedes y noticias (S9). Una grilla pública pide muchas imágenes
        # de golpe y con burst=20 las últimas recibían 503 y quedaban en el
        # placeholder. Misma zona (mismo tope sostenido de 30 r/s), más burst.
        #
        # Precedencia: nginx elige primero el prefijo más largo (/api/) pero,
        # como no lleva `^~`, después prueba las regex y la primera que coincide
        # gana. Por eso esta regex le gana a /api/ sin tocar ese bloque. Cubre
        # también el POST/DELETE de la imagen: se conserva el límite de cuerpo.
        location ~ ^/api/v1/(venues|news)/[^/]+/image$ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Max body size for file uploads
            client_max_body_size 10M;
        }

        # Health check
        location /health {
            proxy_pass http://backend/api/v1/health;
        }
    }
}
